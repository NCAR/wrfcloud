<div class="help-container">
  <div class="help-title">
    {{entry.title}}
  </div>
  <div class="help-text">
    @for (paragraph_text of entry.text; track paragraph_text) {
      <div class="help-paragraph" [innerHTML]="paragraph_text">
      </div>
    }
  </div>
  <div class="help-buttons">
    <button mat-stroked-button class="help-button" (click)="dialogRef.close()">
      Close
    </button>
  </div>
</div>
