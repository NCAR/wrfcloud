<div class="error-container">
  <div class="error-title">
    Action Failed
  </div>
  <div class="error-messages">
    @for (message of data; track message) {
      <div class="error-message">
        {{message}}
      </div>
    }
  </div>

  <mat-divider></mat-divider>

  <div class="error-button-panel" mat-dialog-actions>
    <button mat-raised-button class="error-button" [mat-dialog-close]="">
      Close
    </button>
  </div>
</div>
